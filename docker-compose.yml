services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pacely
      POSTGRES_PASSWORD: pacely
      POSTGRES_DB: pacely
    ports:
      - "5432:5432"
    volumes:
      - pacely_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pacely -d pacely"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pacely_pg:
